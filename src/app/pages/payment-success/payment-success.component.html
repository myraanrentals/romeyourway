<div class="payment-success-container">
  <div class="payment-success-card">
    <svg
      class="success-icon"
      xmlns="http://www.w3.org/2000/svg"
      fill="none"
      viewBox="0 0 24 24"
      stroke-width="2"
      stroke="currentColor"
    >
      <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" />
    </svg>
    <h1>Payment Successful!</h1>
    <p>Thank you for your purchase. Your order has been confirmed.</p>

    <div class="payment-details">
      <p><strong>Order ID:</strong> {{ paymentDetails.orderId }}</p>
      <p><strong>Transaction ID:</strong> {{ paymentDetails.bookingId }}</p>
      <!-- <p><strong>Transaction ID:</strong> {{ paymentDetails.transactionId }}</p>
      <p><strong>Payment Mode:</strong> {{ paymentDetails.paymentMode }}</p>
      <p><strong>Name:</strong> {{ paymentDetails.name }}</p>
      <p><strong>Mobile No:</strong> {{ paymentDetails.mobileNo }}</p> -->
    </div>
    <p class="disclaimer">
      ⚠️ Please save your <strong>Order ID</strong> and <strong>Mobile Number</strong> for future
      reference in case of any issues.
    </p>
    <a href="/" class="back-home-btn">Go to Home</a>
  </div>
</div>

<script>
  dataLayer.push({
    event: 'purchase',
    value: this.amount,
    transaction_id: paymentDetails.orderId ?? paymentDetails.transactionId,
    currency: '₹',
  });
</script>
